services:
  engine:
    build: .
    image: matching-engine
    pull_policy: build
    ports: ["127.0.0.1:8080:8080"]
    volumes: [data:/data]
    healthcheck:
      test: ["CMD", "/usr/local/bin/engine", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
    # Longer than the engine's worst-case shutdown: up to -shutdown-timeout
    # (10s) for HTTP requests, then up to 20s for stalled WebSocket clients
    # (the 10s write timeout, then the close frame's 5s and the handshake's
    # 5s).
    stop_grace_period: 35s

  loadgen:
    image: matching-engine
    profiles: [load]
    entrypoint: ["/usr/local/bin/loadgen", "-addr=engine:8080"]
    depends_on:
      engine:
        condition: service_healthy

volumes:
  data:
