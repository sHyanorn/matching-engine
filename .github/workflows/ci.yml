name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Test files go to the runner's local disk: an fsync on its system
      # disk, where the temporary directory is by default, takes tens of
      # milliseconds (bench-results/m6-windows).
      - run: go test ./...
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --wait
      # A run is valid with 1% of its window missing, so a 30 s window
      # survives a stall of the runner of up to about 300 ms.
      - run: docker compose run --rm loadgen -rate 500 -warmup 2s -duration 30s
      - if: always()
        run: docker compose logs engine && docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failure in one target must not cancel the other
      matrix:
        include:
          - { target: FuzzBook, pkg: internal/book }
          - { target: FuzzCommandValidate, pkg: internal/book }
          - { target: FuzzCheckKeys, pkg: internal/api }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The generated corpus is kept between runs, so each run goes on
      # from where the last one stopped. A cache entry cannot be updated,
      # so every run saves a new one and restores the latest.
      - name: Locate the corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz/github.com/sHyanorn/matching-engine/${{ matrix.pkg }}/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ./${{ matrix.pkg }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz
